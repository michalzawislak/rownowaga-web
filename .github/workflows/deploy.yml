name: Deploy

# Każdy push na `main` przechodzi pełną weryfikację, a dopiero potem trafia
# na produkcję (hosting OVH, https://rownowaga-dietetyka.pl). Pull requesty
# i inne gałęzie przechodzą tylko weryfikację - bez publikacji.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dwa deploye naraz nadpisywałyby sobie pliki na serwerze.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Lint, format, typy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: Testy e2e i dostępności
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Publikacja na OVH
    needs: [verify, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rownowaga-dietetyka.pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Instalacja lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Katalog domowy loginu FTP to główny katalog hostingu: obok `www/` leży
      # tam `.ovhconfig`, którego nie wolno ruszać. Dlatego synchronizujemy
      # wyłącznie `www/` i przerywamy, jeśli go nie ma - zamiast pisać
      # w niewłaściwe miejsce. `--delete` usuwa z `www/` pliki, których nie ma
      # w buildzie (stare zasoby z hashami w nazwach).
      - name: Synchronizacja dist/ -> www/ (SFTP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          # lftp czyta hasło z LFTP_PASSWORD (`--env-password`), więc nie trafia
          # ono do linii poleceń, a znaki specjalne w haśle niczego nie psują.
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            cd www || exit 1;
            mirror --reverse --delete --verbose --parallel=4 dist/ ./;
            bye
          " --env-password -u "$SFTP_USERNAME" "sftp://$SFTP_HOST:22"

      - name: Kontrola strony po publikacji
        run: |
          sleep 5
          curl --fail --silent --show-error --location --output /dev/null https://rownowaga-dietetyka.pl/
          curl --fail --silent --show-error --output /dev/null https://rownowaga-dietetyka.pl/robots.txt
